<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/style.css">
<style>
  body{margin:0;background:#14100f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#e8dcc8}
  .wrap{width:390px;margin:0 auto}
  .stage{position:relative;background:url('../assets/bg/bg_forest.jpg') center/cover;padding:26px 0 18px}
  .stage::before{content:'';position:absolute;inset:0;background:rgba(10,7,6,.42)}
  .cap{font-size:12px;color:#9c8f7a;padding:10px 12px 4px;letter-spacing:.2px}
  .zoom{display:flex;justify-content:center;align-items:center;padding:14px 0;background:url('../assets/bg/bg_forest.jpg') center/cover;position:relative}
  .zoom::before{content:'';position:absolute;inset:0;background:rgba(10,7,6,.42)}
  .zbox{position:relative;width:186px;height:200px;display:flex;align-items:center;justify-content:center}
  .zbox .die{transform:scale(2.5);transform-origin:center}
  .zlab{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:11px;color:#cbbfa8;text-shadow:0 1px 3px #000}

  /* ===== 여기가 새로 넣는 부분 — 상태이상 테두리 ===== */
  .die.art.st{ }
  .die.art.st::after{
    content:''; position:absolute; left:-3px; right:-3px; top:-1px; bottom:-1px;
    background:center/100% 100% no-repeat;
    pointer-events:none;
  }
  .die.art.st-bleed::after{ background-image:url('../assets/ui/status_die_bleed.png'); }
</style></head>
<body>
<div class="wrap">
  <div class="cap">① 실제 크기 · 전투 화면 그대로 (2·4번 주사위에 출혈)</div>
  <div class="stage">
    <div class="dice-zone">
      <button class="die art" style="--tilt:-4deg"><img class="pip-art" src="../assets/dice/pip3.png"></button>
      <button class="die art st st-bleed" style="--tilt:2deg"><img class="pip-art" src="../assets/dice/pip5.png"></button>
      <button class="die art" style="--tilt:6deg"><img class="pip-art" src="../assets/dice/pip2.png"></button>
      <button class="die art st st-bleed" style="--tilt:-3deg"><img class="pip-art" src="../assets/dice/pip6.png"></button>
      <button class="die art" style="--tilt:3deg"><img class="pip-art" src="../assets/dice/pip1.png"></button>
    </div>
  </div>

  <div class="cap">② 다른 표시와 겹칠 때 — 왼쪽부터 [출혈] [출혈+다시굴림] [출혈+족보구성] [평범]</div>
  <div class="stage">
    <div class="dice-zone">
      <button class="die art st st-bleed" style="--tilt:2deg"><img class="pip-art" src="../assets/dice/pip4.png"></button>
      <button class="die art st st-bleed mark-reroll" style="--tilt:-2deg"><img class="pip-art" src="../assets/dice/pip4.png"><small>다시</small></button>
      <button class="die art st st-bleed combo-hint" style="--tilt:4deg"><img class="pip-art" src="../assets/dice/pip4.png"></button>
      <button class="die art" style="--tilt:-5deg"><img class="pip-art" src="../assets/dice/pip4.png"></button>
    </div>
  </div>

  <div class="cap">③ 2.5배 확대 — 붙는 자리 확인용</div>
  <div class="zoom">
    <div class="zbox"><button class="die art"><img class="pip-art" src="../assets/dice/pip5.png"></button><span class="zlab">평범</span></div>
    <div class="zbox"><button class="die art st st-bleed"><img class="pip-art" src="../assets/dice/pip5.png"></button><span class="zlab">출혈</span></div>
  </div>
</div>
</body></html>
