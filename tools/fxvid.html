.die.on .ov,.die.enter .ov,.die.exit .ov{opacity:1}
.cap{position:relative;text-align:center;font-size:12.5px;color:#ffd9c9;margin-top:12px;
  text-shadow:0 1px 4px #000;height:18px}
.cap b{color:#ff8d7a}
.tag{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:10.5px;color:#cbbfa8;
  text-shadow:0 1px 3px #000;white-space:nowrap}
.holder{position:relative}
.zone.lab{gap:34px;padding-bottom:16px}
.note{color:#9c8f7a;font-size:11.5px;margin:5px 0 0}

@keyframes ovEnter{0%{clip-path:inset(0 0 100% 0);filter:brightness(2.6) saturate(1.5)}
 55%{clip-path:inset(0 0 0 0);filter:brightness(2.6) saturate(1.5)}100%{clip-path:inset(0 0 0 0);filter:none}}
@keyframes dieHit{0%{transform:translate(0,0) rotate(0)}18%{transform:translate(-4px,2px) rotate(-3deg)}
 38%{transform:translate(3px,-1px) rotate(2.5deg)}60%{transform:translate(-2px,1px) rotate(-1.4deg)}
 100%{transform:translate(0,0) rotate(0)}}
@keyframes flashRing{0%{box-shadow:0 0 0 0 rgba(255,60,50,.95),0 0 22px 8px rgba(201,48,47,.8)}
 100%{box-shadow:0 0 0 16px rgba(255,60,50,0),0 0 0 0 rgba(201,48,47,0)}}
.die.enter .ov{animation:ovEnter .52s cubic-bezier(.4,0,.3,1) both}
.die.enter{animation:dieHit .5s ease-out}
.die.enter::before{content:'';position:absolute;inset:2px;border-radius:12px;
  animation:flashRing .55s ease-out both;pointer-events:none}

@keyframes idleA{0%,100%{filter:drop-shadow(0 0 2px rgba(255,60,50,.35)) brightness(.92)}
 50%{filter:drop-shadow(0 0 7px rgba(255,60,50,.85)) brightness(1.14)}}
@keyframes idleB{0%{transform:translateY(-1.2px) scaleY(.985);filter:drop-shadow(0 0 2px rgba(255,60,50,.4)) brightness(.95)}
 50%{transform:translateY(1.2px) scaleY(1.015);filter:drop-shadow(0 0 8px rgba(255,60,50,.9)) brightness(1.16)}
 100%{transform:translateY(-1.2px) scaleY(.985);filter:drop-shadow(0 0 2px rgba(255,60,50,.4)) brightness(.95)}}
.vA .ov{animation:idleA 2.2s ease-in-out infinite}
.vB .ov,.vC .ov{animation:idleB 2.6s ease-in-out infinite;transform-origin:top center}
@keyframes dropFall{0%{opacity:0;transform:translateY(0) scale(.6)}12%{opacity:1;transform:translateY(2px) scale(1)}
 70%{opacity:1;transform:translateY(34px) scale(.9)}100%{opacity:0;transform:translateY(46px) scale(.5)}}
.die .drop{display:none;position:absolute;width:5px;height:7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;

  box-shadow:0 0 4px rgba(255,60,50,.8);animation:dropFall 2.6s ease-in infinite}

 100%{transform:scale(1);filter:none}}

 32%{transform:translate(-5px,2px)}52%{transform:translate(3px,-1px)}72%{transform:translate(-2px,1px)}}
@keyframes procSplat{0%{opacity:0;transform:scale(.3)}25%{opacity:.95;transform:scale(1.5)}
 100%{opacity:0;transform:scale(2.4)}}

.die.proc{animation:procDie .45s ease-out}
.die.proc::after{content:'';position:absolute;inset:6px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,70,55,0) 26%,rgba(255,80,62,.9) 48%,rgba(190,30,28,.35) 62%,rgba(190,30,28,0) 78%);
  animation:procSplat .5s ease-out both}

 100%{clip-path:inset(100% 0 0 0);opacity:0;transform:translateY(9px)}}

<script>
const h=document.getElementById('hero'), cap=document.getElementById('cap');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fx(c,ms){ h.classList.remove('enter','proc','exit'); void h.offsetWidth; h.classList.add(c);
  return sleep(ms).then(()=>h.classList.remove(c)); }
async function cycle(){
  cap.innerHTML='&nbsp;'; h.classList.remove('on'); await sleep(700);
  cap.innerHTML='<b>①</b> 적이 출혈을 건다'; h.classList.add('on'); await fx('enter',620); await sleep(300);
  cap.innerHTML='<b>②</b> 걸려 있는 동안 — 계속 맥동한다'; await sleep(2900);
  cap.innerHTML='<b>③</b> 그 주사위로 족보를 짜면 눈금만큼 아프다'; await fx('proc',560); await sleep(700);
  cap.innerHTML='<b>②</b> 아직 걸려 있다'; await sleep(1700);
  cap.innerHTML='<b>④</b> 해제 — 아래로 씻겨 내려간다';
  h.classList.add('exit'); await sleep(430); h.classList.remove('exit','on'); await sleep(1100);
}
(async()=>{ for(let i=0;i<4;i++) await cycle(); })();
</script></body></html>
