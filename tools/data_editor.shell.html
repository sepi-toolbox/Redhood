<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDHOOD 데이터 편집기</title>
<style>
  :root{--ink:#e8dcc8;--dim:#9c8f7a;--line:#3a2f26;--bg:#14100f;--pan:#1c1715;--red:#c9302f;--gold:#e8b64b;--chg:#2f4a2c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(#1c1715,#181312);border-bottom:1px solid var(--line);padding:10px 14px}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:16px;letter-spacing:.5px;color:var(--gold)}
  .ver{font-size:11px;color:var(--dim)}
  .grow{flex:1}
  button{font:inherit;background:#2a221d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
  button:hover{background:#362b24}
  button.primary{background:#7d2320;border-color:#a33;color:#fff}
  button.primary:hover{background:#94302c}
  button:disabled{opacity:.4;cursor:default}
  #q{background:#0f0c0b;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;min-width:150px}
  .badge{background:var(--chg);color:#cfe8c9;border-radius:20px;padding:3px 10px;font-size:12px}
  nav{display:flex;gap:4px;overflow-x:auto;padding:8px 14px 0;background:#181312;border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:19}
  nav button{white-space:nowrap;border:none;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;background:none;color:var(--dim);padding:7px 11px}
  nav button.on{color:var(--gold);border-bottom-color:var(--gold);background:#221b18}
  main{padding:12px 14px 60px}
  .note{color:var(--dim);font-size:12.5px;margin:0 0 10px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{position:sticky;top:98px;background:#241d19;color:#d8c8ab;text-align:left;padding:7px 8px;border:1px solid var(--line);font-weight:600;z-index:5;font-size:12px}
  td{border:1px solid var(--line);padding:3px 6px;vertical-align:top}
  tr.t-uncommon td:first-child{box-shadow:inset 3px 0 #3f6a91}
  tr.t-rare td:first-child{box-shadow:inset 3px 0 #6d55a0}
  tr.t-epic td:first-child,tr.t-legendary td:first-child{box-shadow:inset 3px 0 var(--gold)}
  tr.t-elite td:first-child{box-shadow:inset 3px 0 #3f6a91}
  tr.t-boss td:first-child{box-shadow:inset 3px 0 var(--red)}
  td.ro{color:var(--dim)}
  input.f{background:#0f0c0b;border:1px solid #2b231e;color:var(--ink);border-radius:4px;padding:3px 6px;width:100%;font:inherit;font-size:13px}
  input.f:focus{outline:none;border-color:var(--gold);background:#191412}
  input.f.num{text-align:right;max-width:74px}
  input.f.changed,select.f.changed{background:#1f2e1d;border-color:#4a7a44;color:#d8f0d2}
  select.f{background:#0f0c0b;border:1px solid #2b231e;color:var(--ink);border-radius:4px;padding:3px 4px;font:inherit;font-size:12.5px;max-width:112px}
  select.f:focus{outline:none;border-color:var(--gold)}
  button.mini{padding:1px 6px;font-size:12px;line-height:1.4;border-radius:4px;color:var(--dim)}
  button.mini:hover{color:var(--ink)}
  .efrow{display:flex;gap:4px;align-items:center;margin-bottom:2px}
  .sub{color:var(--dim);font-size:11.5px}
  .kv{display:grid;grid-template-columns:190px 1fr;gap:6px 12px;max-width:760px;align-items:center}
  .kv b{font-weight:600;color:#d8c8ab;font-size:13px}
  dialog{background:var(--pan);color:var(--ink);border:1px solid var(--line);border-radius:10px;max-width:min(860px,94vw);width:100%;padding:0}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  .dlg-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .dlg-b{padding:14px 16px;max-height:66vh;overflow:auto}
  textarea{width:100%;min-height:150px;background:#0f0c0b;color:#cfc3ae;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
  .chg{border-left:2px solid #4a7a44;padding:2px 0 2px 10px;margin:5px 0;font-size:12.5px}
  .chg s{color:#8c7f6c}
  .chg b{color:#a9d6a2}
  .file{margin:14px 0}
  .file h4{margin:0 0 6px;font-size:13px;color:var(--gold);display:flex;gap:8px;align-items:center}
  .hide{display:none!important}
  @media(max-width:640px){th{top:96px}.kv{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="brand">
  <h1>REDHOOD 데이터</h1><span class="ver" id="ver"></span>
  <span class="grow"></span>
  <input id="q" placeholder="검색 (이름·id)">
  <span class="badge" id="cnt">변경 0건</span>
  <button id="undo" disabled>전체 되돌리기</button>
  <button class="primary" id="exp" disabled>내보내기</button>
</div></header>
<nav id="tabs"></nav>
<main id="view"></main>

<dialog id="dlg"><div class="dlg-h"><b>바꾼 값 내보내기</b><span class="grow"></span><button id="close">닫기</button></div>
<div class="dlg-b" id="dlgb"></div></dialog>

<script>
const DB = __DB__;
const ORIG = JSON.parse(JSON.stringify(DB));
document.getElementById('ver').textContent = 'v1.18 기준 · data/*.json';

/* ---------- 경로 읽기·쓰기 ---------- */
const get = (p) => p.split('.').reduce((o,k)=>o==null?o:o[k], DB[p.split(':')[0]] !== undefined ? null : null);
function at(root, path){ return path.split('.').reduce((o,k)=> o==null?o:o[k], root); }
function readP(p){ const [f,rest]=p.split(':'); return rest? at(DB[f],rest) : DB[f]; }
function origP(p){ const [f,rest]=p.split(':'); return rest? at(ORIG[f],rest) : ORIG[f]; }
function writeP(p,v){ const [f,rest]=p.split(':'); const ks=rest.split('.'); const last=ks.pop();
  let o=DB[f];
  for(const k of ks){ if(o[k]===undefined||o[k]===null) o[k] = /^\d+$/.test(k) ? [] : {}; o=o[k]; }
  o[last]=v; }
function parentOf(p){ const [f,rest]=p.split(':'); const ks=rest.split('.'); const last=ks.pop();
  return [ks.reduce((a,k)=>a[k], DB[f]), last]; }
function removeP(p){ const [o,last]=parentOf(p);
  if(Array.isArray(o)) o.splice(Number(last),1); else delete o[last]; }
function redraw(){ const y=window.scrollY; draw(); window.scrollTo(0,y); }

/* ---------- 변경 추적 ---------- */
const changed = new Map();           // path -> {before, after, label}
function shown(v){
  if(v===undefined||v===null) return '없음';
  if(Array.isArray(v)) return v.length+'개';
  if(typeof v==='object'){
    const ks=Object.keys(v);
    if(ks.every(k=>typeof v[k]!=='object')) return ks.map(k=>k+' '+v[k]).join(' ');
    return ks.length+'개 ('+ks.join(', ')+')';
  }
  return String(v);
}
function mark(p, label, def){
  const now=readP(p);
  let was=origP(p);
  if(was===undefined && def!==undefined) was=def;      // 원래 없던 항목은 기본값과 비교한다
  const same = (typeof now==='object'||typeof was==='object') ? JSON.stringify(now)===JSON.stringify(was) : String(now)===String(was);
  if(same) changed.delete(p); else changed.set(p,{before:was,after:now,label});
  const n=changed.size;
  document.getElementById('cnt').textContent='변경 '+n+'건';
  document.getElementById('exp').disabled=!n;
  document.getElementById('undo').disabled=!n;
}

/* ---------- 입력 만들기 ---------- */
function field(path, label, opt={}){
  let v = readP(path);
  if (v === undefined && opt.def !== undefined) v = opt.def;      // 아직 없는 항목 (예: 쿨다운)
  const num = opt.num === true || (opt.num !== false && typeof v === 'number');
  const i = document.createElement('input');
  i.className = 'f' + (num?' num':'');
  i.value = v == null ? '' : v;
  i.dataset.path = path;
  i.title = label + ' — 원래 ' + origP(path);
  i.addEventListener('input', () => {
    let val = i.value;
    if (num){ const f = parseFloat(val); if (Number.isNaN(f)) return; val = f; }
    const fresh = (readP(path) === undefined) && !!opt.onCreate;
    if (fresh) opt.onCreate(val);
    writeP(path, val); mark(path, label, opt.def);
    i.classList.toggle('changed', changed.has(path));
    if (fresh) { redraw(); return; }      // 짝이 되는 칸(예: 파쇄 후 행동)을 바로 보여주려면 한 번 다시 그린다
    refreshDerived();
  });
  if (changed.has(path)) i.classList.add('changed');
  return i;
}
function select(path, label, options, opt={}){
  const cur = readP(path);
  const el = document.createElement('select'); el.className='f';
  options.forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; el.appendChild(o); });
  el.value = cur==null ? '' : String(cur);
  el.title = label + ' — 원래 ' + (origP(path) ?? '없음');
  el.addEventListener('change', ()=>{
    if(el.value==='' && opt.removable){ removeP(opt.removePath || path); mark(opt.removePath || path, label, undefined); redraw(); return; }
    if(cur==null && opt.onCreate){ opt.onCreate(el.value); redraw(); return; }
    writeP(path, el.value); mark(path, label, opt.def);
    el.classList.toggle('changed', changed.has(path));
    if (opt.after) opt.after(el.value);
  });
  if(changed.has(path)) el.classList.add('changed');
  return el;
}
function miniBtn(txt, title, fn){ const b=document.createElement('button'); b.className='mini'; b.textContent=txt;
  b.title=title; b.onclick=fn; return b; }
function cell(tr, node, ro){ const td=document.createElement('td'); if(ro) td.className='ro';
  if(node instanceof Node) td.appendChild(node); else td.innerHTML = node==null?'':node; tr.appendChild(td); return td; }

/* ---------- 공통 도우미 ---------- */
const ENEMY_OPS=[['damage','피해'],['block','방어'],['empower','힘'],['status','상태이상 부여'],['confuse','혼란(구)'],['heal','회복'],['rest','휴식'],['poison','독(🌀)'],['bleed','출혈(🌀)'],['selfDamage','자해(❓)']];
const ST_OPS=(DB.statuses.list||[]).map(s=>[s.id,s.name]);
const DB_statusById={}; (DB.statuses.list||[]).forEach(s=>DB_statusById[s.id]=s); DB.statusById2=DB_statusById;
const ST_RULES=[['onUseFaceDamage','쓰면 눈금만큼 피해'],['onUseFaceCoin','쓰면 눈금만큼 코인'],['noReroll','다시 못 굴림'],
  ['zeroValue','눈금 0 계산'],['faceLow','수치 이하만 나옴'],['faceHigh','수치 이상만 나옴'],['hideFace','눈 가림'],
  ['needReroll','한 번 굴리기 전 값 없음'],['fuse','턴 지나면 폭발'],['linked','같이 굴러감'],
  ['rerollCost','리롤 더 소모'],['spread','양옆으로 번짐']];
const NO_AMOUNT=new Set(['rest']);   // 수치가 없는 효과
const ABILITY_OPS=[['strength','힘'],['focus','집중'],['regen','재생'],['block','방어'],['heal','회복'],
  ['weakEnemy','적 약화'],['bleed','출혈'],['vulnerable','취약'],['stun','기절'],['dodge','회피'],
  ['rerollNext','다음 턴 리롤'],['buffNext','다음 족보 강화'],['cleanse','정화'],['selfDamage','자해']];
const OPN={rest:'휴식',selfDamage:'자해',poison:'독',bleed:'출혈',damage:'피해',block:'방어',empower:'힘',confuse:'혼란',heal:'회복',weaken:'약화',
  vulnerable:'취약',bleed:'출혈',regen:'재생',focus:'집중',strength:'힘',weakEnemy:'적 약화',
  loseHp:'HP 감소',gainRelic:'유물 획득',drain:'흡혈'};
const EN = {}; DB.enemies.forEach((e,i)=>EN[e.id]={e,i});
const ACT={}; DB.acts.acts.forEach(a=>a.themes.forEach(t=>{
  (t.normals||[]).concat(t.elites||[]).forEach(x=>ACT[x]=ACT[x]||[a.act,t.name]);
  ACT[t.boss]=ACT[t.boss]||[a.act,t.name];}));
ACT[DB.acts.finalBoss]=[4,'최후의 어둠'];
/* 표 순서: 막 → 테마 → 난이도(일반·정예·보스). 지도에 나오는 차례 그대로 훑을 수 있게. */
const ORD={}; let _ord=0;
DB.acts.acts.forEach(a=>a.themes.forEach(t=>{
  (t.normals||[]).forEach(x=>{ if(!(x in ORD)) ORD[x]=_ord++; });
  (t.elites ||[]).forEach(x=>{ if(!(x in ORD)) ORD[x]=_ord++; });
  if(t.boss && !(t.boss in ORD)) ORD[t.boss]=_ord++;
}));
if(DB.acts.finalBoss && !(DB.acts.finalBoss in ORD)) ORD[DB.acts.finalBoss]=_ord++;
/* [적, 원래 인덱스] — 인덱스는 JSON 경로에 그대로 쓰이므로 절대 다시 매기지 않는다 */
const ENEMIES = DB.enemies.map((e,i)=>[e,i])
  .sort((A,B)=>((ORD[A[0].id]??9999)-(ORD[B[0].id]??9999)) || (A[1]-B[1]));
const VNAME={}; DB.scoring.categories.forEach(c=>c.variants.forEach(v=>VNAME[v.id]=[c.name,v.name]));

/* ---------- 탭 ---------- */
const TABS=[
 ['개요','바뀐 값은 초록으로 표시된다. 다 고쳤으면 오른쪽 위 [내보내기]를 눌러 바뀐 JSON을 받아 나에게 주면 반영해서 배포한다.',ovw],
 ['적','HP와 기본 행동. 기본 행동은 쓸 수 있는 수가 하나도 없을 때 제약을 전부 무시하고 시동하는 예외 처리 장치다 — 유니크 행동과는 별개이며 아무 행동이나 지정할 수 있다. 개별 행동은 [적행동] 탭에서 고친다.',tabEnemy],
 ['적행동','효과 종류·수치·연계 대상까지 전부 고칠 수 있다. [상태이상 부여]는 종류·세기·지속을 효과 칸에서 정하고, [수치] 칸은 몇 칸에 거는지다 — 세기와 지속을 0으로 두면 상태이상 탭의 기본값을 쓴다. 발동 조건 네 가지 — 가중치는 뽑힐 확률(0이면 추첨에서 빠지고 연계로만 나온다), 해금 턴은 "이 턴부터"(0=제한 없음), 쿨다운은 "쓰고 나서 몇 턴 쉰다"(0=제한 없음, 2면 한 칸 걸러 나온다), 락 턴은 "이 턴이 되면 더 안 씀"(0=제한 없음), 연계는 "앞 행동 다음에 확률로 확정". 파쇄는 그 행동이 예고된 동안 HP에 그만큼 피해를 받으면 유니크 행동으로 무너지는 것 — 방어도로 막힌 피해는 안 센다. 유니크 행동은 추첨에 안 들어가고 파쇄되지도 않는다. 유니크가 나오는 길은 국면 전환과 파쇄 둘뿐이다. 타수는 피해를 몇 대로 나눠 때리는가(기본 1) — 강화·약화가 한 대마다 적용되고 방어도 한 대씩 갉힌다. 피해가 아닌 효과에서는 무시되니 0을 적어두면 된다. 순서 패턴을 쓰는 적은 가중치 대신 순서가 표시된다.',tabMoves],
 ['족보','배수(mult)와 변형의 부가 능력 수치.',tabScore],
 ['주사위','여섯 면을 직접 고친다. 면 구성이 곧 성능이다.',tabDice],
 ['유물','효과 수치는 hook.amount 하나로 정해진다.',tabRelic],
 ['국면','보스의 국면 전환. HP가 임계 아래로 떨어지는 순간 진입 행동(유니크)이 현재 예고를 밀어내고 강제로 나온다.',tabPhase],
 ['막·테마','어느 테마에 어느 적이 나오는지. 배율은 [수치] 탭에.',tabTheme],
 ['만남','이벤트 선택지의 대가와 보상.',tabEvent],
 ['상태이상','주사위 한 칸에 하나씩 붙는 13종. 규칙은 코드에 박혀 있고 여기서는 수치와 지속 턴만 고친다. 지속 0은 영구(정화하거나 조건을 만족해야 풀림)다. 적 행동에서 [상태이상 부여]를 고르면 여기 있는 종류를 건다.',tabStatus],
 ['수치','지도·보상·경제·전역 배율. 게임 전체의 손잡이.',tabConst],
];
const view=document.getElementById('view'), nav=document.getElementById('tabs');
let cur=0;
TABS.forEach((t,i)=>{ const b=document.createElement('button'); b.textContent=t[0];
  b.onclick=()=>{cur=i;draw();}; nav.appendChild(b); });
function draw(){
  [...nav.children].forEach((b,i)=>b.classList.toggle('on',i===cur));
  view.innerHTML=''; const p=document.createElement('p'); p.className='note'; p.textContent=TABS[cur][1];
  view.appendChild(p); TABS[cur][2](view); applyQ();
}
function table(view, cols){
  const t=document.createElement('table'), h=document.createElement('tr');
  cols.forEach(c=>{const th=document.createElement('th'); th.textContent=c; h.appendChild(th);});
  const thead=document.createElement('thead'); thead.appendChild(h); t.appendChild(thead);
  const tb=document.createElement('tbody'); t.appendChild(tb); view.appendChild(t); return tb;
}

/* ---------- 각 탭 ---------- */
function ovw(v){
  const d=document.createElement('div'); d.className='kv';
  const S=DB.acts.scaling, A=DB.act1;
  const put=(k,node)=>{const b=document.createElement('b'); b.textContent=k; d.appendChild(b);
    const w=document.createElement('div'); if(node instanceof Node) w.appendChild(node); else w.innerHTML=node; d.appendChild(w);};
  put('시작 HP', field('act1:player.maxHp','시작 HP'));
  put('턴당 리롤', field('scoring:rerollsPerTurn','턴당 리롤'));
  put('한 막의 층수', field('act1:map.floors','층수'));
  put('층당 적 HP 증가', field('act1:hpScalePerFloor','층당 HP 증가'));
  put('보스 처치 회복 비율', field('acts:bossHealRatio','보스 회복'));
  put('강화 첫 발동 턴', rangeF('acts:surge.firstTurn','강화 첫 턴'));
  put('강화 재발동 간격', rangeF('acts:surge.interval','강화 간격'));
  put('규모','족보 '+DB.scoring.categories.reduce((s,c)=>s+c.variants.length,0)+'개 · 주사위 '+DB.dice.length+
      '종 · 유물 '+DB.relics.length+'개 · 적 '+DB.enemies.length+'종 · 행동 '+DB.enemies.reduce((s,e)=>s+Object.keys(e.moves).length,0)+'개');
  v.appendChild(d);
}
function rangeF(p,label){ const w=document.createElement('div'); w.style.display='flex'; w.style.gap='6px'; w.style.alignItems='center';
  w.appendChild(field(p+'.0',label+' 최소')); const s=document.createElement('span'); s.textContent='~'; s.className='sub'; w.appendChild(s);
  w.appendChild(field(p+'.1',label+' 최대')); return w; }

function tabEnemy(v){
  const tb=table(v,['id','이름','격','막','테마','HP 최소','HP 최대','기본 행동','행동 수','연계']);
  ENEMIES.forEach(([e,i])=>{
    const tr=document.createElement('tr'); tr.className='t-'+e.tier;

// 가중치는 pattern 안에 있다. 국면이 여러 개면 국면마다 따로, 순서 패턴이면 몇 번째인지만 보여준다.
function patternPaths(e, i){
  if (e.phases) return e.phases.map((p,k)=>({ label:'국면'+(k+1), pat:p.pattern, path:`enemies:${i}.phases.${k}.pattern` }));
  if (e.pattern) return [{ label:'', pat:e.pattern, path:`enemies:${i}.pattern` }];
  return [];
}
function weightCell(e, i, mid, m){
  const parts = patternPaths(e, i);
  if (!parts.length) return '—';
  const w = document.createElement('div');
  w.style.cssText = 'display:flex;flex-direction:column;gap:3px';
  parts.forEach(pp => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:5px;align-items:center';
    if (pp.label){ const s2=document.createElement('span'); s2.className='sub'; s2.textContent=pp.label; row.appendChild(s2); }
    if (pp.pat.mode === 'sequence'){
      const idx = pp.pat.order.indexOf(mid);
      const s2 = document.createElement('span'); s2.className='sub';
      s2.textContent = idx < 0 ? '순서 밖' : `순서 ${idx+1}번째`;
      row.appendChild(s2);
    } else if (pp.pat.weights && Object.prototype.hasOwnProperty.call(pp.pat.weights, mid)) {
      row.appendChild(field(`${pp.path}.weights.${mid}`, e.name+' '+m.name+' 가중치'+(pp.label?' '+pp.label:''), {num:true}));
    } else {
      const s2 = document.createElement('span'); s2.className='sub'; s2.textContent='없음'; row.appendChild(s2);
    }
    w.appendChild(row);
  });
  return w;
}
const uniqueOf = (e) => e.uniqueMoves || {};
function addRow(tb, cols, label, fn){
  const tr=document.createElement('tr'); const td=document.createElement('td');
  td.colSpan=cols; td.style.padding='4px 6px'; td.appendChild(miniBtn('+ '+label, label, fn));
  tr.appendChild(td); tb.appendChild(tr);

function freshId(taken, stem){ let n=1; while(taken.has(stem+n)) n++; return stem+n; }
function patternsOf(e){ return (e.phases||[]).map(p=>p.pattern).concat(e.pattern?[e.pattern]:[]); }
// 행동을 지울 때 그 행동을 가리키던 것들을 같이 치운다 (안 그러면 데이터가 깨져 로딩이 막힌다)
function purgeMove(e, mid){
  const cleaned=[];
  for(const p of patternsOf(e)) if(p.weights && mid in p.weights){ delete p.weights[mid]; cleaned.push('가중치'); }
  for(const [k,m] of Object.entries({...e.moves, ...uniqueOf(e)})){
    if(m.followUp && m.followUp.move===mid){ delete m.followUp; cleaned.push(`${m.name}의 연계`); }
    if(m.break && m.break.move===mid){ delete m.break; cleaned.push(`${m.name}의 파쇄`); }
  }
  if(e.defaultMove===mid){ delete e.defaultMove; cleaned.push('기본 행동'); }
  for(const p of (e.phases||[])) if(p.enter===mid){ delete p.enter; cleaned.push('국면 전환'); }
  if(e.moves[mid]) delete e.moves[mid];
  if(e.uniqueMoves && e.uniqueMoves[mid]) delete e.uniqueMoves[mid];
  return [...new Set(cleaned)];
}

        .map(([id,w])=>`${(e.moves[id]||{}).name||id} ${w}`).join(' · ')||'—', 1);
      cell(tr,'',1);
      tb.appendChild(tr);
    }
    const add=document.createElement('tr'); add.dataset.k=(e.id+' '+e.name).toLowerCase();
    const td=document.createElement('td'); td.colSpan=8; td.style.padding='4px 6px';
    td.appendChild(miniBtn('+ 국면 추가', `${e.name}에 국면을 하나 더`, ()=>{
      const clone=(o)=>JSON.parse(JSON.stringify(o));
      if(!e.phases){ e.phases=[{untilHpRatio:0.5, pattern:e.pattern}, {untilHpRatio:0, pattern:clone(e.pattern)}]; delete e.pattern; }
      else {
        const last=e.phases[e.phases.length-1];
        last.untilHpRatio = Number((1/(e.phases.length+1)).toFixed(2));
        e.phases.push({untilHpRatio:0, pattern:clone(last.pattern)});
      }
      mark(`enemies:${i}.phases`, `${e.name} 국면 추가`); redraw(); }));
    add.appendChild(td); tb.appendChild(add);
  });
}

// 게임의 data.js 가 로딩 때 하는 검사를 여기서 미리 돌린다 — 깨진 데이터를 넘기지 않으려고
function validateDB(){
  const bad=[]; const OPS=new Set(ENEMY_OPS.map(([id])=>id)); const STK=new Set(ST_OPS.map(([id])=>id));   // 드롭다운 목록에서 직접 뽑는다 — 따로 적어두면 또 어긋난다
  for(const e of DB.enemies){
    const all={...e.moves, ...(e.uniqueMoves||{})};
    if(!Object.keys(e.moves).length) bad.push(`${e.name}: 일반 행동이 하나도 없음`);
    for(const [mid,m] of Object.entries(all)){
      for(const ef of (m.effects||[])){
        if(!OPS.has(ef.op)) bad.push(`${e.name}/${m.name}: 모르는 효과 "${ef.op}"`);
        if(ef.op==='status' && !STK.has(ef.kind)) bad.push(`${e.name}/${m.name}: 없는 상태이상 "${ef.kind||'(빈칸)'}"`);
      }
      if(m.break){
        if(!(e.uniqueMoves||{})[m.break.move]) bad.push(`${e.name}/${m.name}: 파쇄 대상이 유니크 행동이 아님`);
        if(!(m.break.damage>0)) bad.push(`${e.name}/${m.name}: 파쇄 피해가 0`);
      }
      if(m.followUp && !all[m.followUp.move]) bad.push(`${e.name}/${m.name}: 연계 대상이 없음`);
    }
    if(e.defaultMove && !all[e.defaultMove]) bad.push(`${e.name}: 기본 행동 "${e.defaultMove}" 없음`);
    for(const p of (e.phases||[])) if(p.enter && !(e.uniqueMoves||{})[p.enter]) bad.push(`${e.name}: 국면 전환 대상이 유니크가 아님`);
    const pats=(e.phases||[]).map(x=>x.pattern).concat(e.pattern?[e.pattern]:[]);
    for(const p of pats) for(const id of Object.keys(p.weights||{}))
      if(!e.moves[id]) bad.push(`${e.name}: 가중치의 "${id}" 가 일반 행동이 아님`);
    const called=new Set(Object.values(all).filter(m=>m.followUp).map(m=>m.followUp.move));
    const broken=new Set(Object.values(all).filter(m=>m.break).map(m=>m.break.move));
    for(const id of Object.keys(e.moves)){
      const w=pats.some(p=>(p.weights||{})[id]>0);
      if(!w && !called.has(id) && e.defaultMove!==id) bad.push(`${e.name}/${e.moves[id].name}: 절대 등장할 수 없음 (가중치 0인데 부르는 곳 없음)`);
    }
    for(const id of Object.keys(e.uniqueMoves||{})){
      const reached=broken.has(id) || (e.phases||[]).some(p=>p.enter===id) || e.defaultMove===id || called.has(id);
      if(!reached) bad.push(`${e.name}/${e.uniqueMoves[id].name}: 유니크인데 부르는 곳이 없음 (국면 전환이나 파쇄로 연결하세요)`);
    }
  }
  for(const id of DB.act1.player.startDice) if(!DB.dice.some(d=>d.id===id)) bad.push(`시작 주사위 "${id}" 가 없음`);
  return bad;
}

document.getElementById('exp').onclick=()=>{
  const b=document.getElementById('dlgb'); b.innerHTML='';
  const problems=validateDB();
  if(problems.length){
    const w=document.createElement('div');
    w.style.cssText='border-left:3px solid #c9302f;background:#2a1a17;padding:10px 12px;border-radius:6px;margin-bottom:12px';
    w.innerHTML='<b style="color:#ff8a6b">⚠ 이대로는 게임이 안 뜹니다 — '+problems.length+'건</b>'
      + problems.map(x=>`<div class="sub" style="margin-top:4px">· ${x}</div>`).join('');
    b.appendChild(w);
  }
  const touched=[...new Set([...changed.keys()].map(p=>p.split(':')[0]))];

  const h=document.createElement('div');
  h.innerHTML='<p class="note">바꾼 값 '+changed.size+'건 · 파일 '+touched.length+'개. '
    +'<b>아래 요약을 복사해서 나에게 주기만 해도 됩니다.</b> 전체 JSON이 필요하면 그 아래에서 받으세요.</p>';
  b.appendChild(h);

  const lines=[...changed.entries()].map(([p,c])=>'· '+c.label+' : '+shown(c.before)+' → '+shown(c.after));
  const sum=document.createElement('textarea'); sum.style.minHeight='120px';
  sum.value='REDHOOD 데이터 변경 '+changed.size+'건\n'+lines.join('\n');
  b.appendChild(sum);
  const cp=document.createElement('button'); cp.textContent='요약 복사'; cp.style.margin='6px 0 4px';
  cp.onclick=()=>{ sum.select(); try{document.execCommand('copy');cp.textContent='복사됨';}catch(e){cp.textContent='직접 선택해서 복사하세요';} };
  b.appendChild(cp);

  const list=document.createElement('div');
  list.innerHTML='<h4 style="margin:16px 0 4px;font-size:13px;color:#e8b64b">바뀐 값</h4>';
  [...changed.entries()].forEach(([p,c])=>{ const d=document.createElement('div'); d.className='chg';
    d.innerHTML=c.label+' <s>'+shown(c.before)+'</s> → <b>'+shown(c.after)+'</b>'; list.appendChild(d); });
  b.appendChild(list);

  touched.forEach(f=>{
    const wrap=document.createElement('div'); wrap.className='file';
    const json=JSON.stringify(DB[f],null,2);
    const t=document.createElement('h4'); t.textContent='data/'+f+'.json';
    const dl=document.createElement('button'); dl.textContent='내려받기';
    dl.onclick=()=>{ const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      a.download=f+'.json'; a.click(); };
    t.appendChild(dl); wrap.appendChild(t);
    const ta=document.createElement('textarea'); ta.value=json; wrap.appendChild(ta);
    b.appendChild(wrap);
  });
  dlg.showModal();
};
