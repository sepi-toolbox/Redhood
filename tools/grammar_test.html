@keyframes drip{0%{opacity:0;transform:translateY(0) scale(.5)}10%{opacity:1;transform:translateY(1px) scale(1)}
 78%{opacity:1;transform:translateY(17px) scale(.92)}100%{opacity:0;transform:translateY(24px) scale(.45)}}

/* ===== 마비 : 그림 없이 전부 CSS — 문법이 통하는지 보는 흉내 ===== */
.numb .tint{background:radial-gradient(ellipse at 50% 50%,rgba(60,120,190,.75) 0%,rgba(30,70,130,.6) 60%,rgba(14,34,70,.4) 100%)}
.numb .tint2{box-shadow:inset 0 0 9px 1px rgba(150,220,255,.75);animation:zap 1.1s steps(1) infinite}
.numb .arc{position:absolute;left:8px;right:8px;top:12px;bottom:12px;pointer-events:none;
  animation:arcFlick 1.1s steps(1) infinite}
.numb .arc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 3px rgba(150,220,255,.95))}
.numb .arc.a2{animation-delay:.37s}
.numb .arc.a3{animation-delay:.72s}
@keyframes arcFlick{0%{opacity:0}4%{opacity:1}12%{opacity:1}16%{opacity:0}100%{opacity:0}}
@keyframes zap{0%,100%{opacity:.55}5%{opacity:1}14%{opacity:.6}40%{opacity:1}48%{opacity:.55}}
.numb .nm{color:#8fd4ff;animation:namePulse 1.1s ease-in-out infinite}
.numb .drop{width:3px;height:3px;border-radius:50%;background:#dff2ff;box-shadow:0 0 5px 1px rgba(150,220,255,1);opacity:0}
.numb .s1{left:16px;top:22px;animation:spark 1.1s ease-out infinite}
.numb .s2{left:42px;top:34px;animation:spark 1.1s ease-out infinite .45s}
.numb .s3{left:30px;top:16px;animation:spark 1.1s ease-out infinite .8s}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}6%{opacity:1;transform:translate(0,0) scale(1.5)}
 30%{opacity:.9;transform:translate(3px,-5px) scale(.9)}55%{opacity:0;transform:translate(6px,-11px) scale(.3)}100%{opacity:0}}
.bigz{gap:80px;padding:8px 0 82px;align-items:flex-start}
.bigz .die{transform:scale(2);transform-origin:top center}
</style></head><body><div class="wrap">
<h1>문법이 통하는지 — 출혈 vs 마비</h1>
<p class="s">출혈은 네가 준 그림 한 장. 마비는 그림 없이 전부 CSS로 흉내낸 것. 겹 구조는 똑같다.</p>
